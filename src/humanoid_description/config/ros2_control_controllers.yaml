controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    effort_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

position_controller:
  ros__parameters:
    joints:
      - left_hip_roll
      - left_hip_yaw
      - left_hip_pitch
      - left_knee
      - left_ankle_roll
      - left_ankle_pitch
      - right_hip_roll
      - right_hip_yaw
      - right_hip_pitch
      - right_knee
      - right_ankle_roll
      - right_ankle_pitch
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

effort_position_controller:
  ros__parameters:
    joints:
      - left_hip_roll
      - left_hip_yaw
      - left_hip_pitch
      - left_knee
      - left_ankle_roll
      - left_ankle_pitch
      - right_hip_roll
      - right_hip_yaw
      - right_hip_pitch
      - right_knee
      - right_ankle_roll
      - right_ankle_pitch
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      left_hip_roll: {p: 2500.0, i: 2.0, d: 10.0,ff_velocity_scale: 1.0, i_clamp: 10.0, antiwindup_strategy: "back_calculation"}
      left_hip_yaw: {p: 2500.0, i: 2.0, d: 10.0,ff_velocity_scale: 1.0, i_clamp: 10.0, antiwindup_strategy: "back_calculation"}
      left_hip_pitch: {p: 2500.0, i: 2.0, d: 10.0,ff_velocity_scale: 1.0, i_clamp: 10.0, antiwindup_strategy: "back_calculation"}
      left_knee: {p: 2500.0, i: 2.0, d: 10.0,ff_velocity_scale: 1.0, i_clamp: 10.0, antiwindup_strategy: "back_calculation"}
      left_ankle_roll: {p: 2000.0, i: 2.0, d: 10.0,ff_velocity_scale: 1.0, i_clamp: 10.0, antiwindup_strategy: "back_calculation"}
      left_ankle_pitch: {p: 2000.0, i: 2.0, d: 10.0,ff_velocity_scale: 1.0, i_clamp: 10.0, antiwindup_strategy: "back_calculation"}
      right_hip_roll: {p: 2500.0, i: 2.0, d: 10.0,ff_velocity_scale: 1.0, i_clamp: 10.0, antiwindup_strategy: "back_calculation"}
      right_hip_yaw: {p: 2500.0, i: 2.0, d: 10.0,ff_velocity_scale: 1.0, i_clamp: 10.0, antiwindup_strategy: "back_calculation"}
      right_hip_pitch: {p: 2500.0, i: 2.0, d: 10.0,ff_velocity_scale: 1.0, i_clamp: 10.0, antiwindup_strategy: "back_calculation"}
      right_knee: {p: 2500.0, i: 2.0, d: 10.0,ff_velocity_scale: 1.0, i_clamp: 10.0, antiwindup_strategy: "back_calculation"}
      right_ankle_roll: {p: 2000.0, i: 2.0, d: 10.0,ff_velocity_scale: 1.0, i_clamp: 10.0, antiwindup_strategy: "back_calculation"}
      right_ankle_pitch: {p: 2000.0, i: 2.0, d: 10.0,ff_velocity_scale: 1.0, i_clamp: 10.0, antiwindup_strategy: "back_calculation"}
