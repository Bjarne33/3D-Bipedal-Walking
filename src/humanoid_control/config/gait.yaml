humanoid_walk:
  ros__parameters:
    controller_name: effort_position_controller
    update_rate_hz: 50.0
    ik_iterations: 2
    trajectory_lead_sec: 0.06
    first_swing: right
    forward_axis: [0.0, 1.0, 0.0]  # base-frame walking direction
    ankle_to_sole: 0.05

    # <= 0: derived from the standing pose
    step_width: 0.0
    com_height: 0.0

    step_length: 0.10
    step_time: 1.2
    dsp_ratio: 0.3
    swing_height: 0.05
    zmp_offset_forward: 0.05  # foot centre is 5 cm ahead of the ankle frame
    shift_time: 3.0  # quasi-static CoM shift above the first stance foot
    hold_time: 1.0
    init_time: 0.5
    final_time: 1.5
    stop_transition_time: 0.8
    lookahead_steps: 6
