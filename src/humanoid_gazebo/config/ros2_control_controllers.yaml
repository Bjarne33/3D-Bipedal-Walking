controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    effort_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

position_controller:
  ros__parameters:
    joints:
      - left_hip_roll
      - left_hip_yaw
      - left_hip_pitch
      - left_knee
      - left_ankle_roll
      - left_ankle_pitch
      - right_hip_roll
      - right_hip_yaw
      - right_hip_pitch
      - right_knee
      - right_ankle_roll
      - right_ankle_pitch
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

effort_position_controller:
  ros__parameters:
    joints:
      - left_hip_roll
      - left_hip_yaw
      - left_hip_pitch
      - left_knee
      - left_ankle_roll
      - left_ankle_pitch
      - right_hip_roll
      - right_hip_yaw
      - right_hip_pitch
      - right_knee
      - right_ankle_roll
      - right_ankle_pitch
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    # PD on the joint error; the trajectory velocities feed the D term. I = 0 (the integral
    # adds phase lag and the gravity offsets are small) and no velocity feed-forward.
    # Explicit PD at 1 kHz is only stable for d * dt / I < 2, where I is the smallest inertia
    # the joint drives (swing foot: ankle_roll 0.0044, ankle_pitch 0.013 kg m^2), so the
    # ankle d is capped low (d*dt/I ~ 0.7). Hip and knee d gives a damping ratio of about 0.7
    # for the swing leg (hip 2.0, knee 0.36 kg m^2) and about 0.3-0.5 for the stance load.
    gains:
      left_hip_roll: {p: 2500.0, i: 0.0, d: 100.0, ff_velocity_scale: 0.0}
      left_hip_yaw: {p: 2500.0, i: 0.0, d: 20.0, ff_velocity_scale: 0.0}
      left_hip_pitch: {p: 2500.0, i: 0.0, d: 100.0, ff_velocity_scale: 0.0}
      left_knee: {p: 2500.0, i: 0.0, d: 60.0, ff_velocity_scale: 0.0}
      left_ankle_roll: {p: 2000.0, i: 0.0, d: 3.0, ff_velocity_scale: 0.0}
      left_ankle_pitch: {p: 2000.0, i: 0.0, d: 8.0, ff_velocity_scale: 0.0}
      right_hip_roll: {p: 2500.0, i: 0.0, d: 100.0, ff_velocity_scale: 0.0}
      right_hip_yaw: {p: 2500.0, i: 0.0, d: 20.0, ff_velocity_scale: 0.0}
      right_hip_pitch: {p: 2500.0, i: 0.0, d: 100.0, ff_velocity_scale: 0.0}
      right_knee: {p: 2500.0, i: 0.0, d: 60.0, ff_velocity_scale: 0.0}
      right_ankle_roll: {p: 2000.0, i: 0.0, d: 3.0, ff_velocity_scale: 0.0}
      right_ankle_pitch: {p: 2000.0, i: 0.0, d: 8.0, ff_velocity_scale: 0.0}
