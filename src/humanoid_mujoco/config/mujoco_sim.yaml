mujoco_sim:
  ros__parameters:
    # Name of the emulated trajectory controller: the node subscribes to
    # /<controller_name>/joint_trajectory and reports it as active.
    controller_name: effort_position_controller
    joint_state_broadcaster: joint_state_broadcaster
    real_time_factor: 1.0
    # Publish rates matching Gazebo: joint_state_broadcaster at the 1 kHz controller rate,
    # gazebo_ros_p3d at 100 Hz and gazebo_ros_ft_sensor at 500 Hz. /clock is published
    # every physics step (1 kHz, see worlds/world.xml).
    joint_state_rate: 1000.0
    odom_rate: 100.0
    ft_rate: 500.0
    # Start camera of the viewer: distance from the robot's centre of mass [m]. Azimuth and
    # elevation come from <visual><global> in worlds/world.xml.
    viewer_distance: 3.0
    # PD gains (effort = p * position error + d * velocity error), copied from KP/KD in
    # rl/humanoid_rl/constants.py so that RL policies run with their training gains. They are
    # applied by MuJoCo position actuators with implicit damping and are softer than the
    # Gazebo gains in humanoid_gazebo/config/ros2_control_controllers.yaml.
    gains:
      left_hip_roll: {p: 300.0, d: 8.0}
      left_hip_yaw: {p: 200.0, d: 5.0}
      left_hip_pitch: {p: 300.0, d: 8.0}
      left_knee: {p: 350.0, d: 10.0}
      left_ankle_roll: {p: 150.0, d: 4.0}
      left_ankle_pitch: {p: 150.0, d: 4.0}
      right_hip_roll: {p: 300.0, d: 8.0}
      right_hip_yaw: {p: 200.0, d: 5.0}
      right_hip_pitch: {p: 300.0, d: 8.0}
      right_knee: {p: 350.0, d: 10.0}
      right_ankle_roll: {p: 150.0, d: 4.0}
      right_ankle_pitch: {p: 150.0, d: 4.0}
